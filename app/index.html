<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearth Ledger — Household Budget</title>
<meta name="description" content="A household budget site that runs entirely in your browser: dashboard, transactions, budgets, bills, savings goals and a 50/30/20 analyzer.">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:,">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" width="30" height="30"><rect x="2" y="4" width="28" height="24" rx="5" fill="#0f4c4c"/><path d="M9 21.5 13.5 15l4 3.4L23 11" fill="none" stroke="#f3c96b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="11" r="2" fill="#f3c96b"/></svg></span>
      <span class="brand-text"><strong>Hearth Ledger</strong><small>household budget</small></span>
    </a>
    <nav class="topnav" aria-label="Main">
      <a href="#/" data-nav="dashboard">Overview</a>
      <a href="#/transactions" data-nav="transactions">Transactions</a>
      <a href="#/budgets" data-nav="budgets">Budgets</a>
      <a href="#/bills" data-nav="bills">Bills</a>
      <a href="#/goals" data-nav="goals">Goals</a>
      <a href="#/analyze" data-nav="analyze">50/30/20</a>
    </nav>
    <div class="top-actions">
      <label class="month-pick">Month <input type="month" id="monthInput"></label>
      <button type="button" id="resetBtn" class="btn ghost small">Reset demo data</button>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <footer class="foot">
    <p>Hearth Ledger keeps everything on this device (localStorage). No account, no network calls — export your data any time from Transactions.</p>
  </footer>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toasts" aria-live="polite"></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
